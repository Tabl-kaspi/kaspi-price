name: Автообновление прайса Kaspi

on:
  schedule:
    - cron: '*/15 * * * *'   # каждые 15 минут (UTC)
  workflow_dispatch:          # ручной запуск кнопкой

permissions:
  contents: write             # нужно, чтобы бот мог сохранять price.xml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: pip install pandas requests openpyxl

      - name: Скачивание таблицы и генерация XML
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python generate_xml.py

      - name: Сохранение XML в репозиторий
        run: |
          git config --global user.name "Kaspi Price Bot"
          git config --global user.email "bot@github.com"
          git add price.xml
          git commit -m "Автоматическое обновление прайса" || exit 0
          git push
